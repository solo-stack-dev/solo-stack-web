<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lokaler Demo Player</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px Arial,sans-serif;background:#252729;color:#f8f0d9;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;gap:12px}small{font-size:10px;color:#c0bfae}h2{margin:0;font-size:clamp(18px,4vw,36px);text-align:center}.moon{width:50px;height:50px;background:#f4d875;border-radius:50%;display:grid;place-items:center;color:#252729;font:20px monospace}.controls{display:flex;gap:12px;align-items:center;width:min(100%,550px);margin-top:10px}button{background:#f4d875;border:0;padding:10px 15px;cursor:pointer;min-width:44px}input{min-width:0;width:100%;accent-color:#f4d875}output{font:12px monospace;min-width:38px}:focus-visible{outline:2px solid #fff;outline-offset:3px}@media(max-width:400px){body{gap:8px;padding:12px}.moon{width:32px;height:32px;font-size:14px}.controls{margin-top:0}h2{font-size:18px}}</style></head><body><div class="moon" aria-hidden="true">&lt;/&gt;</div><small>LOKALER VIDEO PLATZHALTER</small><h2 id="chapter">Die Idee</h2><small>Simulierte Wiedergabe · kein echtes Video</small><div class="controls"><button id="play" aria-label="Wiedergabe starten">▶</button><input id="seek" type="range" min="0" max="540" value="0" aria-label="Videoposition"><output id="clock">0:00</output></div><script>
let time=0,playing=false;const seek=document.querySelector('#seek'),clock=document.querySelector('#clock'),play=document.querySelector('#play');
function update(){seek.value=time;clock.textContent=Math.floor(time/60)+':'+String(time%60).padStart(2,'0');document.querySelector('#chapter').textContent=time>=448?'Was bleibt':time>=272?'Der kleine Umweg':time>=84?'Der erste Prompt':'Die Idee';parent.postMessage({type:'time',time},'*');}
play.onclick=()=>{playing=!playing;play.textContent=playing?'Ⅱ':'▶';play.setAttribute('aria-label',playing?'Wiedergabe pausieren':'Wiedergabe starten');};
seek.oninput=()=>{time=+seek.value;update();};
window.addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='seek'&&Number.isFinite(e.data.time)){time=Math.max(0,Math.min(540,Math.floor(e.data.time)));update();}});
setInterval(()=>{if(playing&&!document.hidden){time=Math.min(540,time+1);if(time===540){playing=false;play.textContent='▶';}update();}},1000);update();
</script></body></html>
