<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!-- The navbar crescent (SiteNav .moon): butter disc minus an offset circle, rotated -20°, on a night tile -->
	<defs>
		<radialGradient id="glow" cx="50%" cy="50%" r="50%">
			<stop offset="0.55" stop-color="#fcd772" stop-opacity="0.22" />
			<stop offset="1" stop-color="#fcd772" stop-opacity="0" />
		</radialGradient>
		<mask id="crescent">
			<circle cx="32" cy="32" r="22" fill="#fff" />
			<circle cx="41.5" cy="24.5" r="18.5" fill="#000" />
		</mask>
	</defs>
	<rect width="64" height="64" rx="14" fill="#18191b" />
	<circle cx="32" cy="32" r="30" fill="url(#glow)" />
	<g transform="rotate(-20 32 32)">
		<rect width="64" height="64" fill="#fcd772" mask="url(#crescent)" />
	</g>
</svg>
