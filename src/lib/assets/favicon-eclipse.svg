<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!-- Easter egg favicon: moon-eclipse.svg on the night tile (src/lib/components/site/eclipse-moon.ts) -->
	<defs>
		<radialGradient id="halo">
			<stop offset="0.45" stop-color="#ffffff" stop-opacity="0.8" />
			<stop offset="0.6" stop-color="#dfe0ea" stop-opacity="0.3" />
			<stop offset="1" stop-color="#dfe0ea" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="disc" cx="42%" cy="45%" r="60%">
			<stop offset="0" stop-color="#ffffff" />
			<stop offset="0.75" stop-color="#ecebf2" />
			<stop offset="1" stop-color="#c9cbd8" />
		</radialGradient>
		<mask id="shadow">
			<circle cx="32" cy="32" r="21" fill="#fff" />
			<circle cx="27" cy="31" r="18.5" fill="#000" />
		</mask>
		<mask id="rim">
			<circle cx="32" cy="32" r="24" fill="#fff" />
			<circle cx="25" cy="31" r="20" fill="#000" />
		</mask>
	</defs>
	<rect width="64" height="64" rx="14" fill="#18191b" />
	<circle cx="32" cy="32" r="32" fill="url(#halo)" />
	<g transform="rotate(-20 32 32)">
		<circle cx="32" cy="32" r="21" fill="url(#disc)" />
		<circle cx="32" cy="32" r="21" fill="#0e0f10" mask="url(#shadow)" />
		<circle cx="32" cy="32" r="21.7" fill="none" stroke="#ffffff" stroke-width="1.4" mask="url(#rim)" />
	</g>
</svg>
