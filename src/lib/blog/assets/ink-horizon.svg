<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 96">
	<!-- Interim section break (docs/critique/ROUND-2.md): a sumi horizon, a crooked little tree on a mound (the reading hill
	     seen from far away). Used as a CSS mask, so only the alpha counts; fill in CSS. Edges roughened by turbulence. -->
	<filter id="r" x="-4%" y="-30%" width="108%" height="160%">
		<feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="3" seed="4" />
		<feDisplacementMap in="SourceGraphic" scale="4" xChannelSelector="R" yChannelSelector="G" />
	</filter>
	<filter id="b" x="-2%" y="-200%" width="104%" height="500%">
		<feTurbulence type="fractalNoise" baseFrequency="0.1" numOctaves="2" seed="3" />
